services:
  db:
    image: mysql:8.0
    container_name: ehtukon-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ehtukon
      MYSQL_USER: ehtukon_user
      MYSQL_PASSWORD: ehtukon_pass
    ports:
      - "3307:3306"
    volumes:
      - ehtukon-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ehtukon-data:
